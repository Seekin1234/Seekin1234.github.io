<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Message for You</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Itim&display=swap" rel="stylesheet">
    
    <style>
        body, html {
            margin: 0; padding: 0;
            width: 100%; height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: linear-gradient(rgba(0,0,0,0.2), rgba(0,0,0,0.2)), url("bg.png"); 
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            background-attachment: fixed;
            background-color: #75caff;
            cursor: pointer;
            user-select: none;
            overflow: hidden;
            /* อัปเดต font-family เป็น Itim */
            font-family: 'Itim', cursive;
            flex-direction: column; 
        }

        /* GIF */
        .gif-container {
            width: 180px; 
            height: 180px;
            margin-bottom: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .gif-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 15px;
        }

        #display-text {
            color: white;
            /* ฟอนต์ Itim ตัวจะผอมกว่าเล็กน้อย เลยปรับขนาด font-size ขึ้นอีกนิดครับ */
            font-size: clamp(30px, 8vw, 55px); 
            text-align: center;
            margin-bottom: 30px;
            padding: 0 20px;
            line-height: 1.2;
            font-weight: 400; /* Itim มีน้ำหนักเดียวคือ 400 ซึ่งพอดีอยู่แล้ว */
            text-shadow: 2px 4px 10px rgba(0,0,0,0.5);
        }

        .button-group {
            display: none; 
            gap: 20px;
            align-items: center;
        }

        .btn {
            padding: 10px 40px;
            font-size: 28px;
            font-family: 'Itim', cursive;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            color: white;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }

        .btn-yes { background-color: #4CAF50; }
        .btn-no { background-color: #f44336; }

        /* Animation */
        .bounce-animation {
            animation: popIn 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
        }

        @keyframes popIn {
            0% { opacity: 0; transform: scale(0.3); }
            100% { opacity: 1; transform: scale(1); }
        }
    </style>
</head>
<body id="main-body" onclick="changeMessage()">

    <div id="image-box" class="gif-container bounce-animation">
        <img id="current-img" src="https://media.tenor.com/cDwcajb6iSsAAAAi/dizeno0022sticker.gif" alt="img">
    </div>

    <div id="display-text" class="bounce-animation">ดีจ้าา</div>

    <div id="button-container" class="button-group">
        <button id="yes-btn" class="btn btn-yes" onclick="handleYes(event)">YES</button>
        <button id="no-btn" class="btn btn-no" onclick="handleNo(event)">NO</button>
    </div>

    <script>
        const clickSfx = new Audio('pop.mp3');
        const btnSfx = new Audio('pop.mp3');  

        function playSound(sound) {
            sound.currentTime = 0; 
            sound.play().catch(e => console.log("Sound play error"));
        }

        const content = [
            { text: "ถ้าครีมกําลังอ่านอยู่", img: "https://media.tenor.com/f0iVpqQevsQAAAAi/silly-cat.gif" },
            { text: "ไนท์มีไรจะบอก", img: "https://media.tenor.com/eRGU5l2v-_wAAAAi/cat-meme.gif" },
            { text: "อยากรู้ป่าวว", img: "https://media.tenor.com/gkOKYPloivMAAAAi/cat-eating-cereal.gif" }
        ];

        let currentIndex = 0;
        let isFinished = false;
        let noClickCount = 0;

        const textElement = document.getElementById('display-text');
        const imgElement = document.getElementById('current-img');
        const imgBox = document.getElementById('image-box');
        const buttonContainer = document.getElementById('button-container');
        const bodyElement = document.getElementById('main-body');
        const noBtn = document.getElementById('no-btn');

        function changeMessage() {
            if (isFinished) return; 
            playSound(clickSfx);
            textElement.classList.remove('bounce-animation');
            imgBox.classList.remove('bounce-animation');
            void textElement.offsetWidth; 
            void imgBox.offsetWidth; 

            if (currentIndex < content.length) {
                textElement.innerText = content[currentIndex].text;
                imgElement.src = content[currentIndex].img;
                textElement.classList.add('bounce-animation');
                imgBox.classList.add('bounce-animation');
                // แก้ไขเงื่อนไขให้ตรงกับตัวแปร content ภาษาไทย
                if (content[currentIndex].text === "อยากรู้ป่าวว") {
                    showButtons();
                }
                currentIndex++;
            }
        }

        function showButtons() {
            isFinished = true;
            bodyElement.style.cursor = "default";
            setTimeout(() => {
                buttonContainer.style.display = "flex";
                buttonContainer.classList.add('bounce-animation');
            }, 300);
        }

        function handleNo(event) {
            event.stopPropagation();
            noClickCount++;
            playSound(btnSfx);
            if (noClickCount === 1) {
                noBtn.style.transform = "scale(0.7)";
            } else if (noClickCount === 2) {
                noBtn.style.transform = "scale(0.4)";
                textElement.innerText = "ทําไรอ่ะกดNoทํามาย";
                imgElement.src = "https://media.tenor.com/nLtEykiFQ34AAAAj/kiryuureno-gatinho.gif";
            } else if (noClickCount >= 3) {
                noBtn.style.transform = "scale(0)";
                noBtn.style.opacity = "0";
                noBtn.style.pointerEvents = "none";
                textElement.innerText = "ถึงยังไงก็ต้องกดYesอยู่ดีฮ่าๆๆ";
                textElement.style.color = "#FFEB3B";
                imgElement.src = "https://media.tenor.com/9MlInP80F58AAAAi/cat-tongue-shake-cat-meme.gif";
                textElement.classList.remove('bounce-animation');
                imgBox.classList.remove('bounce-animation');
                void textElement.offsetWidth;
                textElement.classList.add('bounce-animation');
                imgBox.classList.add('bounce-animation');
            }
        }

        function handleYes(event) {
            event.stopPropagation();
            playSound(btnSfx);
            setTimeout(() => {
                window.location.href = "letter.html"; 
            }, 400);
        }
    </script>
</body>
</html>
