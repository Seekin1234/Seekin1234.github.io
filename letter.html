<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>

  <style>
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background: #f0f0f0;
      font-family: sans-serif;
      position: relative;
    }

    .image-box {
      position: relative;
      width: 350px;
      height: 350px;
      cursor: pointer;
      overflow: hidden;
      border-radius: 20px;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(20px); 
      transition: filter 1.5s ease;
    }

    .image-box.reveal img {
      filter: blur(0px);
    }

    .instruction {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0,0,0,0.5);
      padding: 10px 20px;
      border-radius: 30px;
      pointer-events: none;
      transition: opacity 0.5s ease;
    }

    .image-box.reveal .instruction {
      opacity: 0;
    }

    #mystery-button {
      position: absolute;
      bottom: 20px; 
      left: 50%;
      transform: translateX(-50%) scale(0);
      
      padding: 8px 20px;
      font-size: 13px;  
      color: rgba(0, 0, 0, 0.6); 
      
    
      background: rgba(83, 81, 81, 0.829); 
      backdrop-filter: blur(10px); 
      -webkit-backdrop-filter: blur(10px); 
      
      border: 1px solid rgba(255, 255, 255, 0.3);
      border-radius: 50px;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      z-index: 10;
    }

    #mystery-button.show {
      transform: translateX(-50%) scale(1);
      opacity: 1;
    }

    #mystery-button:hover {
      transform: translateX(-50%) scale(1.05);
      background: rgba(87, 161, 230, 0.932);
      color: rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="image-box" onclick="revealImage(this)"
    <img src="picop.png"
    <div class="instruction">กดเร็วๆ</div>
  </div>

  <button id="mystery-button" onclick="mysteryAction()">???</button>

  <script>
    function revealImage(element) {
      element.classList.add("reveal");
    }

    setTimeout(() => {
      const btn = document.getElementById('mystery-button');
      btn.classList.add('show');
    }, 3000);

    function mysteryAction() {
   
      window.location.href = "page2.html";
    }
  </script>

</body>

</html>
