<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Secret</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400..700&display=swap" rel="stylesheet">

  <style>
    body {
      margin: 0;
      width: 100%;
      height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      background-image: linear-gradient(rgba(0,0,0,0.3), rgba(0,0,0,0.3)), url('bg.png'); 
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      background-color: #75caff; 
      font-family: 'Caveat', cursive;
      position: relative;
      overflow-y: auto; /* ให้เลื่อนลงได้ถ้าซูมเยอะจนล้นจอ */
      overflow-x: hidden;
    }

    .content-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      /* ใช้หน่วย vh เพื่อให้ระยะห่างยืดหยุ่นตามความสูงหน้าจอ */
      gap: 3vh; 
      padding: 20px;
      min-height: min-content;
    }

    .image-box {
      position: relative;
      /* ปรับขนาดให้สัมพันธ์กับหน้าจอ (เช่น 40% ของความสูงหน้าจอ) */
      width: 60vh; 
      height: 60vh;
      /* กำหนดขนาดขั้นต่ำและขั้นสูงไว้ไม่ให้เพี้ยนเกินไป */
      max-width: 90vw;
      max-height: 90vw;
      min-width: 280px;
      min-height: 280px;

      cursor: pointer;
      overflow: hidden;
      border-radius: 30px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.3);
      border: 5px solid white;
      transition: transform 0.3s ease;
      flex-shrink: 0; /* ป้องกันรูปโดนบีบ */
    }
    
    .image-box:hover {
        transform: scale(1.02);
    }

    .image-box img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      filter: blur(30px);
      transition: filter 2s ease;
    }

    .image-box.reveal img {
      filter: blur(0px);
    }

    .instruction {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      color: white;
      background: rgba(0,0,0,0.4);
      padding: 1.5vh 3vh;
      border-radius: 50px;
      pointer-events: none;
      transition: opacity 0.5s ease;
      font-size: 4vh; /* ขนาดอักษรขยับตามจอ */
      white-space: nowrap;
      border: 1px solid rgba(255,255,255,0.3);
    }

    .image-box.reveal .instruction {
      opacity: 0;
    }

    #mystery-button {
      transform: scale(0);
      /* ใช้ em หรือ vh เพื่อให้ขนาดปุ่มสัมพันธ์กับขนาดตัวอักษรและหน้าจอ */
      padding: 1.5vh 6vh;
      font-size: 3.5vh;
      min-font-size: 18px;

      font-family: 'Caveat', cursive;
      font-weight: bold;
      color: white; 
      background: rgba(255, 255, 255, 0.2); 
      backdrop-filter: blur(15px); 
      -webkit-backdrop-filter: blur(15px); 
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 100px;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      opacity: 0;
      z-index: 10;
      box-shadow: 0 10px 20px rgba(0,0,0,0.1);
      flex-shrink: 0;
    }

    #mystery-button.show {
      transform: scale(1);
      opacity: 1;
    }

    #mystery-button:hover {
      transform: scale(1.1);
      background: #4CAF50;
      border-color: transparent;
      box-shadow: 0 10px 20px rgba(76, 175, 80, 0.4);
    }
  </style>
</head>
<body>

  <div class="content-wrapper">
    <div class="image-box" onclick="revealImage(this)">
      <img src="picop.png" alt="Secret Image">
      <div class="instruction">open</div>
    </div>

    <button id="mystery-button" onclick="mysteryAction()">???</button>
  </div>

  <script>
    const openSfx = new Audio('paperr.mp3');
    const btnSfx = new Audio('pop.mp3');

    function revealImage(element) {
      if (!element.classList.contains("reveal")) {
        openSfx.currentTime = 0;
        openSfx.play();
      }
      element.classList.add("reveal");
    }

    setTimeout(() => {
      const btn = document.getElementById('mystery-button');
      btn.classList.add('show');
    }, 3000);

    function mysteryAction() {
      btnSfx.currentTime = 0;
      btnSfx.play();
      
      setTimeout(() => {
        window.location.href = "page2.html";
      }, 400); 
    }
  </script>

</body>
</html>
